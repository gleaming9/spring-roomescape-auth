<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="data:,"/>
    <title>방탈출 예약 관리자</title>
    <link rel="stylesheet" href="/css/roomescape.css"/>
</head>
<body data-page="admin">
<div class="app-shell">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/" aria-label="방탈출 예약 홈">
                <span class="brand-mark">R</span>
                <span class="brand-text">
                    <span class="brand-title">방탈출 예약</span>
                    <span class="brand-subtitle">Admin Desk</span>
                </span>
            </a>
            <div class="topbar-actions">
                <nav class="view-toggle" aria-label="화면 전환">
                    <a id="userTab" class="view-button" href="/">사용자</a>
                    <a id="adminTab" class="view-button active" href="/admin.html">관리자</a>
                </nav>
                <div id="sourceStatus" class="status-pill">
                    <span class="status-dot"></span>
                    <span>데이터 불러오는 중</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="admin-dashboard" aria-label="관리자 화면">
            <div class="admin-header">
                <div class="section-heading">
                    <p class="section-kicker">관리자</p>
                    <h1 class="page-title">운영 관리</h1>
                    <p class="admin-note">테마와 예약 시간을 관리하고 현재 예약 현황을 확인합니다.</p>
                </div>
                <div class="admin-metrics" aria-label="운영 현황">
                    <div class="metric">
                        <span id="themeMetric" class="metric-value">0</span>
                        <span class="metric-label">테마</span>
                    </div>
                    <div class="metric">
                        <span id="timeMetric" class="metric-value">0</span>
                        <span class="metric-label">시간</span>
                    </div>
                    <div class="metric">
                        <span id="reservationMetric" class="metric-value">0</span>
                        <span class="metric-label">예약</span>
                    </div>
                </div>
            </div>

            <div class="admin-grid">
                <section class="admin-panel" aria-labelledby="themeFormTitle">
                    <div class="panel-head">
                        <p class="section-kicker">테마</p>
                        <h2 id="themeFormTitle" class="panel-title">테마 등록</h2>
                    </div>
                    <form id="themeForm" class="admin-form">
                        <label class="field">
                            <span class="label">이름</span>
                            <input id="adminThemeName" class="text-input" type="text" placeholder="신규 테마"/>
                        </label>
                        <label class="field">
                            <span class="label">설명</span>
                            <textarea id="adminThemeDescription" class="textarea-input"
                                      placeholder="테마 설명"></textarea>
                        </label>
                        <label class="field">
                            <span class="label">썸네일 URL</span>
                            <input id="adminThemeThumbnail" class="text-input" type="url"
                                   placeholder="https://example.com/theme.png"/>
                        </label>
                        <button class="primary-button" type="submit">테마 추가</button>
                    </form>
                    <p id="adminMessage" class="admin-message"></p>
                </section>

                <section class="admin-panel" aria-labelledby="timeFormTitle">
                    <div class="panel-head">
                        <p class="section-kicker">시간</p>
                        <h2 id="timeFormTitle" class="panel-title">예약 시간 등록</h2>
                    </div>
                    <form id="timeForm" class="admin-form compact-form">
                        <label class="field">
                            <span class="label">시작 시간</span>
                            <input id="adminTimeStartAt" class="text-input" type="time" value="21:00"/>
                        </label>
                        <button class="primary-button" type="submit">시간 추가</button>
                    </form>
                </section>

                <section class="admin-panel wide-panel" aria-labelledby="reservationListTitle">
                    <div class="panel-head split-head">
                        <div>
                            <p class="section-kicker">예약</p>
                            <h2 id="reservationListTitle" class="panel-title">예약 현황</h2>
                        </div>
                        <span id="reservationCount" class="admin-count">0건</span>
                    </div>
                    <div id="adminReservationList" class="admin-list reservation-admin-list" aria-label="예약 목록"></div>
                </section>

                <section class="admin-panel" aria-labelledby="themeListTitle">
                    <div class="panel-head split-head">
                        <div>
                            <p class="section-kicker">목록</p>
                            <h2 id="themeListTitle" class="panel-title">테마 목록</h2>
                        </div>
                        <span id="adminThemeCount" class="admin-count">0개</span>
                    </div>
                    <div id="adminThemeList" class="admin-list" aria-label="관리자 테마 목록"></div>
                </section>

                <section class="admin-panel" aria-labelledby="timeListTitle">
                    <div class="panel-head split-head">
                        <div>
                            <p class="section-kicker">목록</p>
                            <h2 id="timeListTitle" class="panel-title">시간 목록</h2>
                        </div>
                        <span id="adminTimeCount" class="admin-count">0개</span>
                    </div>
                    <div id="adminTimeList" class="admin-list" aria-label="관리자 시간 목록"></div>
                </section>
            </div>
        </section>
    </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/js/roomescape.js" defer></script>
</body>
</html>
