<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="data:,"/>
    <title>방탈출 예약</title>
    <link rel="stylesheet" href="/css/roomescape.css"/>
</head>
<body data-page="user">
<div class="app-shell">
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/" aria-label="방탈출 예약 홈">
                <span class="brand-mark">R</span>
                <span class="brand-text">
                    <span class="brand-title">방탈출 예약</span>
                    <span class="brand-subtitle">Room Escape Desk</span>
                </span>
            </a>
            <div class="topbar-actions">
                <nav class="view-toggle" aria-label="화면 전환">
                    <a id="userTab" class="view-button active" href="/">사용자</a>
                    <a id="adminTab" class="view-button" href="/admin.html">관리자</a>
                </nav>
                <div id="sourceStatus" class="status-pill">
                    <span class="status-dot"></span>
                    <span>데이터 불러오는 중</span>
                </div>
                <div id="memberBox" class="member-box" hidden>
                    <span id="loginMemberName" class="member-name"></span>
                    <button id="logoutButton" class="secondary-button" type="button">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section id="loginPage" class="login-page" aria-labelledby="loginTitle">
            <div class="login-copy">
                <p class="section-kicker">예약 서비스</p>
                <h1 id="loginTitle" class="login-title">로그인 후 예약을 관리하세요</h1>
                <p class="login-note">현재 단계에서는 웹 브라우저 세션으로 로그인 상태를 유지합니다.</p>
                <dl class="credential-box">
                    <div>
                        <dt>테스트 이메일</dt>
                        <dd>brown@example.com</dd>
                    </div>
                    <div>
                        <dt>비밀번호</dt>
                        <dd>password</dd>
                    </div>
                </dl>
            </div>

            <form id="loginForm" class="login-panel">
                <div class="panel-head">
                    <p class="section-kicker">로그인</p>
                    <h2 class="panel-title">계정 확인</h2>
                </div>
                <label class="field">
                    <span class="label">이메일</span>
                    <input id="loginEmail" class="text-input" type="email" placeholder="brown@example.com"
                           autocomplete="email"/>
                </label>
                <label class="field">
                    <span class="label">비밀번호</span>
                    <input id="loginPassword" class="text-input" type="password" placeholder="password"
                           autocomplete="current-password"/>
                </label>
                <button id="loginButton" class="primary-button" type="submit">로그인</button>
                <p id="loginMessage" class="message"></p>
            </form>
        </section>

        <section id="userApp" class="user-app" aria-label="사용자 예약 화면" hidden>
            <section class="popular-band" aria-labelledby="popularTitle">
                <div class="section-heading">
                    <p class="section-kicker">인기 테마</p>
                    <h1 id="popularTitle" class="page-title">최근 1주 기준 상위 10개</h1>
                </div>
                <div id="popularList" class="popular-list" aria-label="인기 테마 목록"></div>
            </section>

            <section class="reservation-layout" aria-label="사용자 예약">
                <div class="workspace">
                    <div class="panel-block">
                        <div class="control-strip">
                            <label class="field">
                                <span class="label">예약 날짜</span>
                                <input id="dateInput" class="text-input" type="date"/>
                            </label>
                            <p class="date-note" id="dateNote"></p>
                        </div>
                    </div>

                    <div class="panel-block">
                        <div class="area-header">
                            <h2 class="area-title">테마 선택</h2>
                            <span id="themeCount" class="area-subtitle"></span>
                        </div>
                        <div id="themeGrid" class="theme-grid" aria-label="테마 목록"></div>
                    </div>

                    <div class="panel-block">
                        <div class="area-header">
                            <h2 class="area-title">예약 가능한 시간</h2>
                            <span id="timeCount" class="area-subtitle"></span>
                        </div>
                        <div id="timeGrid" class="time-grid" aria-label="예약 시간 목록"></div>
                    </div>
                </div>

                <aside class="summary-panel" aria-label="예약 요약">
                    <div class="panel-head">
                        <p class="section-kicker">예약 정보</p>
                        <h2 class="panel-title">선택 내역</h2>
                    </div>
                    <div class="summary-list">
                        <div class="summary-row">
                            <span class="summary-label">예약자</span>
                            <strong id="summaryMember" class="summary-value">로그인이 필요합니다.</strong>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">날짜</span>
                            <span id="summaryDate" class="summary-value">-</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">테마</span>
                            <span id="summaryTheme" class="summary-value">-</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">시간</span>
                            <span id="summaryTime" class="summary-value">-</span>
                        </div>
                    </div>
                    <button id="reserveButton" class="reserve-button" type="button" disabled>예약하기</button>
                    <p id="formMessage" class="message"></p>
                </aside>
            </section>

            <section class="my-reservations-section" aria-labelledby="myReservationTitle">
                <div class="section-row">
                    <div>
                        <p class="section-kicker">내 예약</p>
                        <h2 id="myReservationTitle" class="area-title">조회·변경·취소</h2>
                    </div>
                    <button id="myReservationButton" class="secondary-button" type="button">새로고침</button>
                </div>
                <p id="myReservationMessage" class="message"></p>
                <div id="myReservationList" class="my-reservation-list" aria-label="내 예약 목록"></div>
            </section>
        </section>
    </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/js/roomescape.js" defer></script>
</body>
</html>
